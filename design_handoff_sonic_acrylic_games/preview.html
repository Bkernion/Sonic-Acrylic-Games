<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>SAG screenshot host</title>
<link rel="stylesheet" href="midfi/tokens.css" />
<style>
  html, body { margin: 0; background: #f0eee9; }
  #root { display: flex; gap: 24px; padding: 24px; justify-content: center; }
  .label { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: #5C5246; }
  .pair { position: relative; padding-top: 22px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="frames/ios-frame.jsx"></script>
<script type="text/babel" src="frames/android-frame.jsx"></script>
<script type="text/babel" src="midfi/lib.jsx"></script>
<script type="text/babel" src="midfi/screens.jsx"></script>

<script type="text/babel">
const SCREENS = [
  { id: 'home', comp: HomeNewsfeed },
  { id: 'connect', comp: ConnectionsScreen },
  { id: 'spell', comp: SpellScreen },
  { id: 'lyric', comp: LyricScreen },
  { id: 'order', comp: OrderScreen },
  { id: 'attr', comp: AttrScreen },
  { id: 'influ', comp: InfluenceScreen },
  { id: 'win', comp: WinScreen },
];
const W = 380, H = 800;
let _root = ReactDOM.createRoot(document.getElementById('root'));
function show(i) {
  const { comp: Comp } = SCREENS[i];
  _root.render(
    <React.Fragment>
      <div className="pair">
        <div className="label">iOS</div>
        <IOSDevice width={W} height={H}>
          <div style={{ height: '100%', display: 'flex', flexDirection: 'column', paddingTop: 54, paddingBottom: 34, boxSizing: 'border-box', background: 'var(--paper)' }}>
            <Comp />
          </div>
        </IOSDevice>
      </div>
      <div className="pair">
        <div className="label">Android</div>
        <AndroidDevice width={W} height={H}><Comp /></AndroidDevice>
      </div>
    </React.Fragment>
  );
}
window.show = show;
show(0);
</script>
</body>
</html>
